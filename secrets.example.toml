# Copy to secrets.toml (git-ignored) and fill in. build.rs embeds the values at compile time;
# the environment variables in brackets override them, both at build time and at run time.
# Without them Webox still builds and runs: sign-in shows "not configured" and the GIF picker its error state.

# OAuth client of the Webex desktop app (WEBOX_CLIENT_ID, WEBOX_CLIENT_SECRET).
webex_client_id = ""
webex_client_secret = ""

# Giphy API key for the GIF and sticker picker (WEBOX_GIPHY_API_KEY).
giphy_api_key = ""
