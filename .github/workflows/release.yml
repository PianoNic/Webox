name: Release

# Publishing the release drafted by release-drafter.yml runs this: the gates, the version bump on main, then the Windows zip +
# installer, the Linux tarball and the macOS app zip, each with a .sha256 file ("<hex>  <name>", what the in-app updater checks).
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  ci:
    name: Gates
    uses: ./.github/workflows/ci.yml

  sync-version:
    name: Bump version to the release tag
    needs: ci
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: write
    outputs:
      version: ${{ steps.sync.outputs.version }}
      sha: ${{ steps.sync.outputs.sha }}
    steps:
      - name: Checkout main
        uses: useblacksmith/checkout@75c49b6ed30ce59336e9252425796cfcfac155f8 # v1
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git as the maintainer
        run: |
          git config user.name "PianoNic"
          git config user.email "79938743+PianoNic@users.noreply.github.com"

      - name: Bump Cargo.toml and Cargo.lock
        id: sync
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          TAG_VERSION="$(printf '%s' "$TAG_NAME" | sed -E 's/^[^0-9]*//')"
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

          sh scripts/bump-version.sh "$TAG_VERSION"
          git add Cargo.toml Cargo.lock
          if git diff --cached --quiet; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: bumped version to $TAG_VERSION [skip ci]"

          for _ in 1 2 3; do
            if git push origin HEAD:main; then
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::The version bump does not rebase onto main cleanly."
              exit 1
            fi
          done
          echo "::error::Could not push the version bump to main."
          exit 1

  windows:
    name: Windows zip + installer
    needs: sync-version
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout the commit the version bump landed on
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.sync-version.outputs.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # build.rs bakes these into the binary (sign-in and the GIF picker work out of the box).
      - name: Build
        env:
          WEBOX_CLIENT_ID: ${{ secrets.WEBOX_CLIENT_ID }}
          WEBOX_CLIENT_SECRET: ${{ secrets.WEBOX_CLIENT_SECRET }}
          WEBOX_GIPHY_API_KEY: ${{ secrets.WEBOX_GIPHY_API_KEY }}
        run: cargo build --release --locked -p webox --bin webox

      - name: Zip
        shell: pwsh
        env:
          VERSION: ${{ needs.sync-version.outputs.version }}
        run: |
          $name = "webox-$env:VERSION-windows-x64"
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Copy-Item target/release/webox.exe, LICENSE, THIRD_PARTY_NOTICES.md, README.md "dist/$name/"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip" -Force

      - name: Installer (Inno Setup)
        shell: pwsh
        env:
          VERSION: ${{ needs.sync-version.outputs.version }}
        run: |
          # Inno Setup 6 or 7, preinstalled on the runner or from Chocolatey.
          function Find-Iscc { foreach ($b in ${env:ProgramFiles(x86)}, $env:ProgramFiles) { foreach ($v in 6, 7) { $p = Join-Path $b "Inno Setup $v\ISCC.exe"; if (Test-Path $p) { return $p } } } }
          $iscc = Find-Iscc
          if (-not $iscc) { choco install innosetup -y --no-progress; if ($LASTEXITCODE) { exit 1 }; $iscc = Find-Iscc }
          if (-not $iscc) { Write-Error 'ISCC.exe not found'; exit 1 }
          pwsh packaging/windows/make-ico.ps1 -Out dist/webox.ico
          # ISCC resolves relative paths from the .iss file's folder, so pass absolute ones.
          $dist = (Resolve-Path dist).Path
          & $iscc /Qp "/DAppVersion=$env:VERSION" "/DSourceDir=$dist\webox-$env:VERSION-windows-x64" "/DIconFile=$dist\webox.ico" "/O$dist" packaging\windows\webox.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Checksums and upload
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.sync-version.outputs.version }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          $files = "dist/webox-$env:VERSION-windows-x64.zip", "dist/Webox-Setup-$env:VERSION-x64.exe"
          foreach ($f in $files) {
            $h = (Get-FileHash -Algorithm SHA256 $f).Hash.ToLower()
            [IO.File]::WriteAllText("$f.sha256", "$h  $(Split-Path -Leaf $f)`n")
          }
          gh release upload "$env:TAG_NAME" $files ($files | ForEach-Object { "$_.sha256" }) --clobber

  macos:
    name: macOS app (zip)
    needs: sync-version
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout the commit the version bump landed on
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.sync-version.outputs.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # Webox.app (one universal program for Apple Silicon and Intel), signed ad hoc (no Apple Developer certificate; docs/MACOS.md), zipped. Same script as macos-package.yml.
      - name: Build and pack Webox.app
        env:
          WEBOX_CLIENT_ID: ${{ secrets.WEBOX_CLIENT_ID }}
          WEBOX_CLIENT_SECRET: ${{ secrets.WEBOX_CLIENT_SECRET }}
          WEBOX_GIPHY_API_KEY: ${{ secrets.WEBOX_GIPHY_API_KEY }}
        run: sh packaging/macos/make-app.sh

      - name: Checksum and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          cd dist
          for f in webox-*-macos-*.zip; do shasum -a 256 "$f" > "$f.sha256"; done
          gh release upload "$TAG_NAME" webox-*-macos-*.zip webox-*-macos-*.zip.sha256 --clobber

  linux:
    name: Linux tarball
    needs: sync-version
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout the commit the version bump landed on
        uses: useblacksmith/checkout@75c49b6ed30ce59336e9252425796cfcfac155f8 # v1
        with:
          ref: ${{ needs.sync-version.outputs.sha }}
          persist-credentials: false

      # docs/LINUX.md: WebKitGTK + GTK for the sign-in window, ALSA, GStreamer headers for video playback.
      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libxkbcommon-x11-0 libgl1 libegl1 fonts-dejavu-core

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Pack, checksum and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          WEBOX_CLIENT_ID: ${{ secrets.WEBOX_CLIENT_ID }}
          WEBOX_CLIENT_SECRET: ${{ secrets.WEBOX_CLIENT_SECRET }}
          WEBOX_GIPHY_API_KEY: ${{ secrets.WEBOX_GIPHY_API_KEY }}
        run: |
          set -euo pipefail
          sh packaging/linux/make-tarball.sh
          cd dist
          for f in webox-*-linux-*.tar.gz; do sha256sum "$f" > "$f.sha256"; done
          gh release upload "$TAG_NAME" webox-*-linux-*.tar.gz webox-*-linux-*.tar.gz.sha256 --clobber
