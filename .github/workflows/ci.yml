name: CI

on:
  # Draft pull requests (agents' work in progress) build nothing: CI runs once a PR is marked ready, and on every push
  # after that, so a failing run means a finished change is broken, not that work is still under way.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Build and test (Linux)
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: useblacksmith/checkout@75c49b6ed30ce59336e9252425796cfcfac155f8 # v1
        with:
          persist-credentials: false

      # docs/LINUX.md: WebKitGTK + GTK for the sign-in window, ALSA, GStreamer headers for video playback.
      - name: Install the Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libxkbcommon-x11-0 libgl1 libegl1 fonts-dejavu-core

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # Only the example plugins the plugin tests load; `cargo test` compiles the app itself (a separate `cargo build` compiled
      # the 55k-line app crate a second time).
      - run: cargo build --locked -p collabhost_slash_commands -p collabhost_pride_theme

      - run: cargo test --locked

  # docs/theming-engine.md phase 0: the sample scenes of the pull request render pixel-identical to its base branch. Linux,
  # because the software OpenGL of xvfb (Mesa llvmpipe) renders deterministically; GitHub's Windows runners have no OpenGL 2.
  # A pull request that changes the look on purpose carries the label "look-change"; the job then only reports.
  parity:
    name: Pixel parity (Linux)
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: useblacksmith/checkout@75c49b6ed30ce59336e9252425796cfcfac155f8 # v1
        with:
          fetch-depth: 0

      - name: Install the Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libxkbcommon-x11-0 libgl1 libegl1 fonts-dejavu-core xvfb

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # The base first, then the pull request in the same target folder: only the app crate compiles twice.
      - name: Build the base and the pull request
        run: |
          git worktree add ../base "origin/${{ github.base_ref }}"
          (cd ../base && cargo build --locked -p webox -p collabhost_pride_theme --target-dir "$GITHUB_WORKSPACE/target")
          mkdir -p ../bin-base ../bin-head
          cp target/debug/webox target/debug/libcollabhost_pride_theme.so ../bin-base/
          cargo build --locked -p webox -p collabhost_pride_theme
          cp target/debug/webox target/debug/libcollabhost_pride_theme.so ../bin-head/

      - name: Render and compare
        run: |
          xvfb-run -a -s "-screen 0 1920x1200x24" pwsh scripts/parity.ps1 -BaseExe ../bin-base/webox -Exe ../bin-head/webox -Out parity \
            || { if ${{ contains(github.event.pull_request.labels.*.name, 'look-change') }}; then echo "::warning::look changed (label look-change)"; else exit 1; fi; }

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: parity
          path: parity
          if-no-files-found: ignore

  windows:
    name: Build and test (Windows)
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # Only the example plugins the plugin tests load; `cargo test` compiles the app itself (a separate `cargo build` compiled
      # the 55k-line app crate a second time).
      - run: cargo build --locked -p collabhost_slash_commands -p collabhost_pride_theme

      - run: cargo test --locked

  macos:
    name: Build and test (macOS)
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # Only the example plugins the plugin tests load (libcollabhost_*.dylib here).
      - run: cargo build --locked -p collabhost_slash_commands -p collabhost_pride_theme

      - run: cargo test --locked

      # Which media tests really ran here (VideoToolbox / AVFoundation) and which skipped for want of a desktop or encoder.
      - name: Media backends on this runner
        run: |
          cargo test --locked -p webox --bin webox media:: -- --nocapture 2>&1 | grep -E "SKIPPED|encoder:|decoder:|test result" || true

      # docs/MACOS.md: the app starts, renders the sample data and quits; the picture is kept as an artifact.
      - name: Start-up screenshot
        timeout-minutes: 15
        run: |
          cargo build --locked -p webox --bin webox
          WEBOX_NO_UPDATE_CHECK=1 target/debug/webox --sample --screenshot shot.png
          test -s shot.png

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-screenshot
          path: shot.png
          if-no-files-found: warn

  nix:
    name: Nix build
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 90
    # Linux CI already compiles the same code: on pull requests only when the Nix packaging or the dependencies change; always
    # on main; never as a release gate.
    if: ${{ github.event_name != 'release' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    steps:
      - uses: useblacksmith/checkout@75c49b6ed30ce59336e9252425796cfcfac155f8 # v1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: need
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" != pull_request ] || git diff --name-only "origin/$BASE_REF...HEAD" | grep -qE '^(flake\.(nix|lock)|packaging/nix/|Cargo\.(toml|lock)|build\.rs)'; then
            echo run=1 >> "$GITHUB_OUTPUT"
          else
            echo "No Nix packaging or dependency change: skipped."; echo run=0 >> "$GITHUB_OUTPUT"
          fi

      - if: steps.need.outputs.run == '1'
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31

      # The Nix store between runs. The package builds the dependencies as their own derivation (crane cargoArtifacts), so a
      # restored store only recompiles Webox itself. The key changes with the inputs of that derivation; a miss restores the
      # newest store of an older key (nixpkgs and the toolchain stay) and saves a new one. No purge step: it needs
      # `actions: write`, which release.yml (it calls this workflow) doesn't grant; GitHub evicts unused caches after 7 days.
      - if: steps.need.outputs.run == '1'
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'Cargo.lock', '**/Cargo.toml', 'packaging/nix/package.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
          # Paths not reachable from the result links (see below) go first; stays well under GitHub's 10 GB per repository.
          gc-max-store-size-linux: 5G

      # result -> the package, result-1 -> the dependency artifacts: both stay GC roots, so the cache keeps them.
      - if: steps.need.outputs.run == '1'
        run: nix build -L .#default .#default.cargoArtifacts

      - if: steps.need.outputs.run == '1'
        name: Smoke test the package
        run: |
          result/bin/webox --version
          # build.rs embeds secrets.toml; without it sign-in is "not configured".
          grep -q C694e2 "$(nix path-info .#default.unwrapped)/bin/webox" || { echo "::error::sign-in client id not embedded"; exit 1; }
          sudo apt-get install -y --no-install-recommends xvfb > /dev/null
          WEBOX_NO_UPDATE_CHECK=1 timeout 300 xvfb-run -a -s "-screen 0 1600x1000x24" result/bin/webox --sample --screenshot shot.png
          test -s shot.png

      - if: always() && steps.need.outputs.run == '1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nix-screenshot
          path: shot.png
          if-no-files-found: warn
