name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Build and test (Linux)
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: useblacksmith/checkout@75c49b6ed30ce59336e9252425796cfcfac155f8 # v1

      # docs/LINUX.md: WebKitGTK + GTK for the sign-in window, ALSA, GStreamer headers for video playback.
      - name: Install the Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libxkbcommon-x11-0 libgl1 libegl1 fonts-dejavu-core

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # Only the example plugins the plugin tests load; `cargo test` compiles the app itself (a separate `cargo build` compiled
      # the 55k-line app crate a second time).
      - run: cargo build --locked -p collabhost_slash_commands -p collabhost_pride_theme

      - run: cargo test --locked

  windows:
    name: Build and test (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # Only the example plugins the plugin tests load; `cargo test` compiles the app itself (a separate `cargo build` compiled
      # the 55k-line app crate a second time).
      - run: cargo build --locked -p collabhost_slash_commands -p collabhost_pride_theme

      - run: cargo test --locked

  macos:
    name: Build and test (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # Only the example plugins the plugin tests load (libcollabhost_*.dylib here).
      - run: cargo build --locked -p collabhost_slash_commands -p collabhost_pride_theme

      - run: cargo test --locked

      # Which media tests really ran here (VideoToolbox / AVFoundation) and which skipped for want of a desktop or encoder.
      - name: Media backends on this runner
        run: |
          cargo test --locked -p webox --bin webox media:: -- --nocapture 2>&1 | grep -E "SKIPPED|encoder:|decoder:|test result" || true

      # docs/MACOS.md: the app starts, renders the sample data and quits; the picture is kept as an artifact.
      - name: Start-up screenshot
        timeout-minutes: 15
        run: |
          cargo build --locked -p webox --bin webox
          WEBOX_NO_UPDATE_CHECK=1 target/debug/webox --sample --screenshot shot.png
          test -s shot.png

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-screenshot
          path: shot.png
          if-no-files-found: warn

  nix:
    name: Nix build
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 90
    # buildRustPackage rebuilds all crates in one derivation (12-18 min) and Linux CI already compiles the same code: on pull
    # requests only when the Nix packaging or the dependencies change; always on main; never as a release gate.
    if: ${{ github.event_name != 'release' }}
    steps:
      - uses: useblacksmith/checkout@75c49b6ed30ce59336e9252425796cfcfac155f8 # v1
        with:
          fetch-depth: 0

      - id: need
        run: |
          if [ "${{ github.event_name }}" != pull_request ] || git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^(flake\.(nix|lock)|packaging/nix/|Cargo\.(toml|lock)|build\.rs)'; then
            echo run=1 >> "$GITHUB_OUTPUT"
          else
            echo "No Nix packaging or dependency change: skipped."; echo run=0 >> "$GITHUB_OUTPUT"
          fi

      - if: steps.need.outputs.run == '1'
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31

      - if: steps.need.outputs.run == '1'
        run: nix build -L .
